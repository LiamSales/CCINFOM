<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HOA Management</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #172b25;
            background: #f3f6f4;
            font-synthesis: none;
        }

        * { box-sizing: border-box; }

        body { margin: 0; }

        header {
            padding: 24px clamp(20px, 5vw, 64px);
            color: #fff;
            background: #174f3b;
        }

        header h1 { margin: 0 0 6px; font-size: 1.6rem; }
        header p { margin: 0; color: #d3e8dd; }

        main {
            width: min(1120px, calc(100% - 32px));
            margin: 32px auto;
        }

        .toolbar, .panel {
            border: 1px solid #dce5df;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 4px 16px rgb(23 43 37 / 5%);
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: end;
            gap: 12px;
            padding: 18px;
            margin-bottom: 18px;
        }

        label { display: grid; gap: 6px; font-size: .85rem; font-weight: 600; }

        select, input, button {
            min-height: 40px;
            border: 1px solid #cbd8d0;
            border-radius: 7px;
            padding: 8px 11px;
            background: #fff;
            color: inherit;
            font: inherit;
        }

        select { min-width: 190px; }
        input { min-width: 220px; }

        button, .docs-link {
            border: 0;
            background: #176548;
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        button:hover, .docs-link:hover { background: #104c36; }

        .docs-link {
            display: inline-flex;
            min-height: 40px;
            align-items: center;
            border-radius: 7px;
            padding: 8px 13px;
        }

        .panel { overflow: hidden; }

        .panel-heading {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px;
            padding: 18px 20px;
            border-bottom: 1px solid #e7ede9;
        }

        .panel-heading h2 { margin: 0; font-size: 1.1rem; }
        #status { color: #557066; font-size: .9rem; }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 16px; border-bottom: 1px solid #edf1ee; }
        th { background: #f8faf9; color: #456257; font-size: .8rem; text-transform: uppercase; }
        td { max-width: 360px; overflow-wrap: anywhere; font-size: .9rem; }
        tbody tr:last-child td { border-bottom: 0; }
        .message { padding: 28px 20px; color: #60766c; text-align: center; }

        @media (max-width: 600px) {
            main { width: calc(100% - 20px); margin: 18px auto; }
            .toolbar { align-items: stretch; }
            .toolbar > * { width: 100%; }
            select, input { min-width: 0; width: 100%; }
        }
    </style>
</head>
<body>
    <header>
        <h1>HOA Management</h1>
        <p>Browse records from the HOA system API.</p>
    </header>
    <main>
        <section class="toolbar" aria-label="Record controls">
            <label for="resource">Records
                <select id="resource">
                    <option value="individuals">Individuals</option>
                    <option value="homeowners">Homeowners</option>
                    <option value="residents">Residents</option>
                    <option value="properties">Properties</option>
                    <option value="assets">Assets</option>
                    <option value="activities">Asset activities</option>
                </select>
            </label>
            <label for="search">Filter displayed records
                <input id="search" type="search" placeholder="Type to filter">
            </label>
            <button id="refresh" type="button">Refresh</button>
            <a class="docs-link" href="/swagger-ui/index.html">API documentation</a>
        </section>

        <section class="panel" aria-live="polite">
            <div class="panel-heading">
                <h2 id="heading">Individuals</h2>
                <span id="status"></span>
            </div>
            <div id="results" class="message">Loading records…</div>
        </section>
    </main>

    <script>
        const resourceSelect = document.querySelector("#resource");
        const searchInput = document.querySelector("#search");
        const results = document.querySelector("#results");
        const heading = document.querySelector("#heading");
        const status = document.querySelector("#status");
        let loadedRecords = [];

        function displayValue(value) {
            if (value === null || value === undefined) return "—";
            if (typeof value === "object") return JSON.stringify(value);
            return String(value);
        }

        function renderRows() {
            const query = searchInput.value.trim().toLowerCase();
            const filteredRows = loadedRecords.filter(row =>
                JSON.stringify(row).toLowerCase().includes(query)
            );

            status.textContent = `${filteredRows.length} of ${loadedRecords.length} records`;
            results.replaceChildren();

            if (filteredRows.length === 0) {
                results.className = "message";
                results.textContent = loadedRecords.length === 0
                    ? "No records found."
                    : "No records match your filter.";
                return;
            }

            const columns = [...new Set(filteredRows.flatMap(row => Object.keys(row)))];
            const table = document.createElement("table");
            const thead = table.createTHead();
            const headerRow = thead.insertRow();
            columns.forEach(column => {
                const cell = document.createElement("th");
                cell.scope = "col";
                cell.textContent = column;
                headerRow.append(cell);
            });

            const tbody = table.createTBody();
            filteredRows.forEach(row => {
                const tableRow = tbody.insertRow();
                columns.forEach(column => {
                    const cell = tableRow.insertCell();
                    cell.textContent = displayValue(row[column]);
                });
            });

            results.className = "table-wrap";
            results.append(table);
        }

        async function loadRecords() {
            const resource = resourceSelect.value;
            heading.textContent = resourceSelect.selectedOptions[0].textContent;
            status.textContent = "Loading…";
            results.className = "message";
            results.textContent = "Loading records…";

            try {
                const response = await fetch(`/${resource}`, {
                    headers: { Accept: "application/json" }
                });
                if (!response.ok) {
                    throw new Error(`Request failed (${response.status} ${response.statusText})`);
                }

                const records = await response.json();
                if (!Array.isArray(records)) {
                    throw new Error("The API response was not a list of records.");
                }
                loadedRecords = records;
                renderRows();
            } catch (error) {
                loadedRecords = [];
                status.textContent = "Could not load records";
                results.className = "message";
                results.textContent = `${error.message}. Check that the application and database are running.`;
            }
        }

        resourceSelect.addEventListener("change", loadRecords);
        document.querySelector("#refresh").addEventListener("click", loadRecords);
        searchInput.addEventListener("input", renderRows);
        loadRecords();
    </script>
</body>
</html>
